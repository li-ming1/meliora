[package]
name = "meliora"
version = "0.0.6"
edition = "2024"
description = "Music Player"
license = "Apache-2.0"
readme = "README.md"
categories = ["multimedia::audio"]

[features]
runtime_shaders = ["gpui_platform/runtime_shaders"]
console = ["dep:console-subscriber", "tokio/tracing"]
online = ["dep:zed-reqwest", "dep:sha2"]
# Exposes the [mem] probe's `atlas=` field (main.rs atlas_probe_snapshot).
# Requires the MELIORA PERMANENT OBSERVABILITY PATCH in the local gpui-ce
# checkout (directx_atlas.rs, see AGENTS.md); upstream gpui-ce has no
# `meliora_atlas_probe` symbol, so enabling this anywhere the patch is absent
# (CI, other machines) fails the link. Keep OFF in CI and public builds.
atlas-probe = []
# Shared plumbing for any online source: HTTP-range streaming playback, cover
# cache, online-aware queue items. Enabled by each provider feature below.
online_sources = []
kugou = ["online", "online_sources", "dep:md-5", "dep:num-bigint-dig", "dep:qrcode"]
default = []

[dependencies]
anyhow = "1"
audioadapter-buffers = "5"
async-compression = { version = "0.4", features = ["zlib", "tokio"] }
async-trait = "0.1"
base64 = "0.22"
bitflags = "2"
# Named directly so http_cover_bytes can return the aggregated body without a
# full-buffer copy (zed-reqwest re-exports it only as an unnameable impl trait).
bytes = "1"
camino = { version = "1", features = ["serde1"] }
chrono = "0.4"
# CLI surface is one optional positional arg + --version/--about: the default
# color/suggestions machinery (and its anstream/strsim chains) is dead weight.
clap = { version = "4", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
] }
cntp_i18n = { version = "0.3", features = ["gpui"] }
console-subscriber = { version = "0.5", optional = true }
cpal = { version = "0.18.2", features = ["pipewire"] }
dateparser = "0.3"
derive_more = { version = "2", features = ["debug"] }
directories = "6"
file-rotate = "0.8.0"
flate2 = "1"
futures = "0.3"
gpui = { package = "gpui-unofficial", path = "vendor/gpui-unofficial-shim" }
gpui_platform = { git = "https://github.com/gpui-ce/gpui-ce", rev = "ae7c41157feb180ce096cd1afdb2d6b48850b539", features = ["wayland", "x11", "font-kit"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp"] }
indexmap = { version = "2", features = ["serde"] }
intx = "0.1"
lofty = "0.25"
md-5 = { version = "0.11", optional = true }
num-bigint-dig = { version = "0.9", optional = true, default-features = false, features = ["std"] }
qrcode = { version = "0.14", optional = true, default-features = false, features = ["image"] }
notify = "8"
nucleo = "0.5"
palette = "0.7"
postcard = { version = "1", default-features = false, features = ["use-std"] }
rand = "0.9"
raw-window-handle = "0.6"
realfft = "3"
rtrb = "0.3"
rubato = "5"
rust-embed = "8"
rustc-hash = "2"
same-file = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
# Update artifact integrity (updater.rs): sha256 of the downloaded bare
# binary against the release's checksums.txt. Pulled in by `online` only.
sha2 = { version = "0.11", optional = true }
smallvec = "1"
sqlx = { version = "0.9", default-features = false, features = [
    "chrono",
    "runtime-tokio",
    "sqlite",
    "macros",
    "migrate",
] }
symphonia = { version = "0.6", default-features = false, features = [
    "adpcm",
    "aiff",
    "alac",
    "flac",
    "id3v2",
    "isomp4",
    "mp3",
    "ogg",
    "opt-simd",
    "pcm",
    "vorbis",
    "wav",
] }
symphonia-adapter-libopus = "0.3"
symphonia-adapter-fdk-aac = "0.2"
# Only System/CPU/memory (troubleshooting, memory probe) and Disks (drive
# probing in the scanner) have call sites; component/network/user do not, and
# component alone drags WMI/OLE/RPC windows subsystems into the Windows build.
sysinfo = { version = "0.39", default-features = false, features = ["system", "disk"] }
thiserror = "2"
# fs/io-util are declared explicitly: the code calls tokio::fs and the
# tokio::io extension traits directly (scan record, session storage,
# playlist persistence) and must not depend on other crates' feature
# unification to expose them.
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "rt-multi-thread",
    "macros",
    "time",
    "sync",
] }
tokio-stream = { version = "0.1", features = ["io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-segmentation = "1"
url = "2.5"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zed-reqwest = { version = "0.12.15-zed", default-features = false, optional = true, features = [
    "json",
    "gzip",
    "macos-system-configuration",
    # this was native-roots, but this caused intermittent issues on Windows
    "rustls-tls-webpki-roots",
] }
notify-debouncer-full = "0.7.0"
# Global allocator. The Windows NT heap never returns mid-size free segments
# to the OS, so interactive churn (browsing, searching) ratchets private bytes
# up even with no leak; mimalloc aggressively decommits idle pages, letting
# committed memory fall back after the activity stops.
mimalloc = { version = "0.1", features = ["no_thp"] }

[patch.crates-io]
# cntp-i18n (crates.io) depends on the package name `gpui-unofficial`; the
# vendored shim satisfies it from the same source as our own `gpui` dep.
# See vendor/gpui-unofficial-shim/ for why it exists and why the gpui rev
# inside is pinned.
gpui-unofficial = { path = "vendor/gpui-unofficial-shim" }

# NOTE: gpui_platform is pinned to the same rev as the shim's `gpui`
# (ae7c411): as a workspace member it drags the whole gpui-ce tree, and two
# revs in the graph mean two copies of the `gpui` crate → E0308 trait
# mismatch. ae7c411 is the checkout with the local directx_atlas patch.

# Image copy with a trimmed format set: gpui-ce hard-imports
# image::codecs::{gif,webp} (img.rs, platform.rs), so the vendor's own
# `default` carries bmp/gif/jpeg/png/webp — Meliora's exact rendering set.
# Requested-feature unification across the [patch] seam is not reliable
# (cargo 1.99 dropped `webp` there, breaking CI on three platforms);
# avif/exr/tiff/qoi and their chains (ravif/rav1e AV1 encoder, lebe,
# zune-* etc.) stay out of the graph, measured at -5.9MB (-10.8%) on the
# release binary. Update this copy when bumping `image`.
image = { path = "vendor/image-trim" }

[build-dependencies]
anyhow = "1"
cntp_i18n_gen = "0.3"
dotenvy = "0.15"
embed-resource = "3"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    # 零字面引用但不可删：StorageLibrary::Folders() 的返回类型
    # IObservableVector 落在 Foundation::Collections，windows crate 内该方法被
    # #[cfg(all(feature = "Foundation_Collections", feature = "Storage_Search"))]
    # 双重门控（settings/scan.rs 默认库扫描依赖它）。
    "Foundation_Collections",
    "Media",
    # 零字面引用但不可删：StorageLibrary::Folders() 在 windows crate 内被
    # #[cfg(feature = "Storage_Search")] 门控（settings/scan.rs 默认库扫描依赖它）。
    "Storage_Search",
    "Storage_Streams",
    "Win32_Foundation",
    # 零字面引用但不可删：CreateFileW 的签名（scan/decode、disk.rs）引用
    # Security::SECURITY_ATTRIBUTES，整个 Security 模块被本 feature 门控。
    "Win32_Security",
    "Win32_Storage_FileSystem",
    # 桌面歌词悬浮窗关闭 DWM 自动装饰（NCRENDERING/BORDER_COLOR/CORNER，
    # desktop_lyrics.rs）——透明 PopUp 上 Win11 的 1px 描边+投影肉眼可见。
    "Win32_Graphics_Dwm",
    # DeviceIoControl（library/scan/disk.rs:197 磁盘序列号探测，2026-11-07
    # 核实存在字面引用）的字面引用；IO 模块整体被 #[cfg(feature = "Win32_System_IO")] 门控。
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_SystemServices",
    # 托盘图标加载（LoadImageW 的 hInstance，tray/windows.rs）。
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_Power",
    "Win32_System_Recovery",
    # 系统托盘壳（Shell_NotifyIconW / NOTIFYICONDATAW，tray/windows.rs）。
    "Win32_UI_Shell",
    # 零字面引用但不可删：单实例守护的 MessageBoxW（main.rs enforce_single_instance）
    "Win32_UI_WindowsAndMessaging"
] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
core-text = "=21.0.0" # GPUI issue, zed#47168
block2 = "0.6"
imagesize = "0.14"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSImage", "NSBezierPath"] }
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes"] }
objc2-foundation = { version = "0.3", features = [
    "NSData",
    "NSDictionary",
    "NSProcessInfo",
    "NSValue",
] }
objc2-media-player = { version = "0.3", features = ["MPNowPlayingInfoCenter"] }

[target.'cfg(target_os = "linux")'.dependencies]
mpris-server = "0.10"
zbus = "5"

[profile.dev]
split-debuginfo = "unpacked"

[profile.dev-optimized]
inherits = "release"
debug = "full"
strip = "none"
lto = "none"
opt-level = "s"

[profile.release]
# Speed over size: the decode/resample/image paths are realtime-adjacent and
# measurably slower under "s" (opt for size). Binary stays stripped below.
# codegen-units 保持默认 16（本文件不显式设置）：2026-09-13 在本树上实测
# codegen-units=1 使大数组路径回归 54-106%（3000px 封面缩放 149->307ms、
# 100k checkpoint zlib 265->523ms），换来 10.5% 更小的二进制与 2.3x 更慢的
# 构建。当时的测量载体 decode/checkpoint benches 是临时脚本、从未入仓，
# 2026-11-08 已补建入仓的可跑载体：`cargo test --release --features kugou
# decode_bench -- --ignored --nocapture`（src/library/scan/decode_bench.rs，
# PNG 解码缩放 / checkpoint zlib / xxh3 三热环段）与 `cargo test --release
# --features kugou bench_backdrop_segments -- --ignored --nocapture`
# （src/ui/components/backdrop_pipeline.rs 底部 bench 模块，去噪/重采样/锐化
# 分段占比）。另有 `cargo test --release row_build_bench -- --ignored
# --nocapture`（src/library/row_build_bench.rs，配 src/test_support.rs 的
# bench_summarize）与 tools/bench_track_sort_indexes*.py（DB 侧索引 A/B）；
# 扫描 paired 全扫计时与 [db]/[mem] 探针也是可用口径。动 codegen-units 或
# z 档 pin 表前必须用这些载体重新实测。
# panic=abort: no unwind landing pads across the whole graph. The app never
# catches panics (the 2026-09-16 atlas catch_unwind guard was removed) and a
# panic in any thread is fatal anyway; cargo forces unwind back for test
# builds automatically.
opt-level = 3
lto = "thin"
panic = "abort"
strip = "symbols"

# 体积策略：依赖默认降到 "z"（minsize），只有实测在实时/帧/查询/搜索路径上的包点名回 3。
#
# 为什么这样切：`.text` 占 exe 的 67%（24,773,928 / 35,309,568），嵌入资源只占
# 8.6%，所以体积只能从机器码拿。上一版按包点名 20 个"明显非实时"的包降档，实测
# 只有 −339,968 B（−0.96%）——归档里的 object 字节数不是 .text 的可用代理（多数
# 被链接器剥掉或在依赖方单态化），真正的量在长尾里。全部依赖降 "s" 的上界实测：
# exe 32,124,416（−3,185,152 B，−9.02%），.text 21,742,744（−12.23%）。
#
# 下面这组回 3 的包就是"上界不能白拿"的那部分：本文件的既有结论（decode/resample/
# image 路径在 "s" 下实测更慢）与 AGENTS.md 的实时性优先级。包名一律取自
# `cargo tree -e normal`——profile 的包名写错是**静默不生效**，而 cargo 只支持
# "*" 这一种通配（没有 serde-* 前缀 glob），所以只能逐包具名。
[profile.release.package."*"]
# 2026-11-06 实测：冷路径依赖 "s" → "z"（minsize），同 features 下 exe
# 33,064,960 → 32,687,616 B（−377,344 B / −1.14%），.text
# 23,266,888 → 22,733,624 B。热路径包仍在下面逐名回 3，实时/帧/查询/
# 搜索路径的编译档未变。冷路径运行时 A/B 部分闭合（2026-11-08，decode_bench
# 载体）：校验和/去重五候选（simd-adler32、strength_reduce、transpose、
# xxhash-rust、zune-core）整批回 3 对 PNG 解码 / checkpoint zlib / xxh3
# 三热环零可测收益，已回 z，负结果档案见下方 fdeflate 段；其余
# 冷路径包的运行时敏感性仍未测（证据缺口收窄，未闭合）。
#
# 通配 z 会连带命中 -sys 包的 C 编译：cc 1.4.3 对 MSVC 把 opt-level z/s/1
# 统统映射成 /O1；opusic-sys 的 CMake 构建则落到 MinSizeRel（2026-11-07
# 实测 target/release/build/opusic-sys-c0dda5925a7ca1a2/out/build/
# CMakeCache.txt 为 CMAKE_BUILD_TYPE=MinSizeRel）。
#
# 2026-11-10 定案（体积优先，用户拍板）：全局分配器（libmimalloc-sys）、
# SQLite 查询引擎（libsqlite3-sys）、Opus/AAC C 核（opusic-sys /
# fdk-aac-sys）、TLS 密码本体（ring）、标签解析（lofty）与 PNG 解压链
# （fdeflate / crc32fast）不单列回 3 档，随通配 z 编译。这批包的运行时
# 敏感性未做完整 A/B（唯一实测是 PNG 解码三热环上校验和/去重五候选回 3
# 无收益，档案见下方 fdeflate 段）；若日后出现可感知的扫描/查询/解码延迟，
# 回本段逐包加回 3 档做 paired A/B，别整批回滚。420/500 内存校准值测于
# 2026-09-27（当时全图 opt-level 3）；z 档只让代码与堆更小，阈值仍成立。
opt-level = "z"

# 音频解码（symphonia 的实现分散在 core/common/各 codec/各 format/两个适配器里，
# 只钉 `symphonia` 一个名字等于没钉）
[profile.release.package]
symphonia = { opt-level = 3 }
symphonia-core = { opt-level = 3 }
symphonia-common = { opt-level = 3 }
symphonia-bundle-flac = { opt-level = 3 }
symphonia-bundle-mp3 = { opt-level = 3 }
symphonia-codec-adpcm = { opt-level = 3 }
symphonia-codec-alac = { opt-level = 3 }
symphonia-codec-pcm = { opt-level = 3 }
symphonia-codec-vorbis = { opt-level = 3 }
symphonia-format-isomp4 = { opt-level = 3 }
symphonia-format-ogg = { opt-level = 3 }
symphonia-format-riff = { opt-level = 3 }
symphonia-metadata = { opt-level = 3 }
symphonia-adapter-fdk-aac = { opt-level = 3 }
symphonia-adapter-libopus = { opt-level = 3 }
# 音频输出路径（2026-10-20 审计补）：豁免集合原本只覆盖了解码侧，回调取数的
# rtrb 环形缓冲、cpal 的 WASAPI 事件循环与 audioadapter 的缓冲搬运全在 "s" 里。
# 回调体本身是本仓代码（根 crate 恒为 3），但它逐块调用的这三层不是——按
# AGENTS.md 的实时性优先级（REALTIME SAFETY > 一切），输出侧与解码侧同级。
rtrb = { opt-level = 3 }
cpal = { opt-level = 3 }
audioadapter-buffers = { opt-level = 3 }
# 封面解码与缩放（缩略图、背景管线、取色的输入）。2026-10-20 审计补：JPEG/PNG
# 的逐像素解码本体在 zune-jpeg / png 里，`image` 门面只做容器分发与 resize——
# 只钉门面等于把解码热区留在了 "s"（webp 当初钉 image-webp 正是这个理由）。
image = { opt-level = 3 }
image-webp = { opt-level = 3 }
zune-jpeg = { opt-level = 3 }
png = { opt-level = 3 }
# fdeflate / crc32fast（PNG IDAT 解压与 CRC 本体，Cargo.lock 并存 png
# 0.17.16/0.18.1 两代）随通配 z 编译。负结果档案（别再重测同一批）：
# 2026-11-08 decode_bench 载体上，simd-adler32 / strength_reduce / transpose /
# xxhash-rust / zune-core 五包整批回 3 对 PNG 解码+缩放、checkpoint zlib、
# xxh3 三热环零可测收益（103.1/108.4ms → 104.2/111.3ms），校验和占解码
# 壁钟 <5%。
palette = { opt-level = 3 }
palette_math = { opt-level = 3 }
# 重采样与 FFT（音频线程与均衡器分析）
rubato = { opt-level = 3 }
realfft = { opt-level = 3 }
rustfft = { opt-level = 3 }
# 每帧渲染与无障碍。2026-10-20 审计补：taffy 是布局引擎本体（§59 判读"剩余
# draw 成本在布局/预绘制/场景提交"，布局就是它）；etagere 是图集分配器，paint
# 期每个新瓦片都要过它。两者都是 gpui 的直接依赖但不在 gpui crate 内，通配
# 降档时它们跟着掉进 "s"。
taffy = { opt-level = 3 }
etagere = { opt-level = 3 }
gpui = { opt-level = 3 }
gpui-unofficial = { opt-level = 3 }
gpui_platform = { opt-level = 3 }
gpui_windows = { opt-level = 3 }
gpui_shared_string = { opt-level = 3 }
gpui_collections = { opt-level = 3 }
gpui_refineable = { opt-level = 3 }
gpui_sum_tree = { opt-level = 3 }
gpui_scheduler = { opt-level = 3 }
gpui_ce_util = { opt-level = 3 }
accesskit = { opt-level = 3 }
accesskit_consumer = { opt-level = 3 }
accesskit_windows = { opt-level = 3 }
# 运行时、查询与搜索（[db] 探针里会出现在 UI 线程上的那段，以及按键即算的匹配器）
tokio = { opt-level = 3 }
tokio-stream = { opt-level = 3 }
sqlx = { opt-level = 3 }
sqlx-core = { opt-level = 3 }
sqlx-sqlite = { opt-level = 3 }
nucleo = { opt-level = 3 }
nucleo-matcher = { opt-level = 3 }
# 扫描检查点的 zlib 压缩（历史实测过它的工作量）
flate2 = { opt-level = 3 }
miniz_oxide = { opt-level = 3 }
