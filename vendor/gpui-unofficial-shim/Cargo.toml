[package]
name = "gpui-unofficial"
version = "0.231.2"
edition = "2024"
publish = false
# Vendored from https://git.mailliw.org/hummingbird/gpui-unofficial-shim@74c47fc
# (Apache-2.0, upstream author mailliw). The shim lets `gpui-ce` pose as
# `gpui-unofficial`, the package name cntp-i18n depends on. Vendored because
# upstream declares its `gpui` dependency against gpui-ce WITHOUT a rev: every
# fresh-environment resolve (CI) tracked gpui-ce's default branch, which
# renamed the `gpui` package, and broke with "no matching package named
# `gpui`". The rev pin below is the whole point of vendoring.

[features]
default = ["font-kit", "wayland", "x11", "windows-manifest"]
font-kit = ["gpui_real/font-kit"]
input-latency-histogram = ["gpui_real/input-latency-histogram"]
inspector = ["gpui_real/inspector"]
leak-detection = ["gpui_real/leak-detection"]
screen-capture = ["gpui_real/screen-capture"]
test-support = ["gpui_real/test-support"]
wayland = ["gpui_real/wayland"]
windows-manifest = ["gpui_real/windows-manifest"]
x11 = ["gpui_real/x11"]

[dependencies]
# Keep in sync with the gpui_platform rev pinned below (two revs in the graph
# mean two copies of the `gpui` crate → E0308 trait mismatch).
gpui_real = { package = "gpui", git = "https://github.com/gpui-ce/gpui-ce", rev = "ae7c41157feb180ce096cd1afdb2d6b48850b539", default-features = false }
