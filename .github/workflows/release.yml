name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: macos-arm64
            os: macos-latest
          - name: windows-x86_64
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml 钉死 Windows-msvc（仅本机非标准工具链需要），
      # CI 上删除并改用各平台宿主 stable
      - name: Drop machine-specific toolchain pin
        shell: bash
        run: rm -f rust-toolchain.toml

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libpipewire-0.3-dev pkg-config \
            libfontconfig1-dev libxkbcommon-dev libwayland-dev libx11-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - uses: Swatinem/rust-cache@v2

      - name: Build release (kugou, netease)
        run: cargo build --release --features kugou,netease

      - name: Package Windows (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/release/meliora.exe `
            -DestinationPath meliora-${{ github.ref_name }}-${{ matrix.name }}.zip

      - name: Package macOS (.app tar.gz)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          APP="Meliora.app"
          mkdir -p "$APP/Contents/MacOS"
          cp target/release/meliora "$APP/Contents/MacOS/meliora"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>meliora</string>
            <key>CFBundleIdentifier</key><string>com.meliora.player</string>
            <key>CFBundleName</key><string>Meliora</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
          </dict>
          </plist>
          PLIST
          tar -czf meliora-${{ github.ref_name }}-${{ matrix.name }}.tar.gz "$APP"

      - name: Package Linux (tar.gz)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          tar -czf meliora-${{ github.ref_name }}-${{ matrix.name }}.tar.gz -C target/release meliora

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: meliora-${{ github.ref_name }}-${{ matrix.name }}.*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## ${{ github.ref_name }}

            **Meliora** —— 基于 Rust + GPUI 的轻量第三方桌面音乐播放器：单文件分发、内存占用低、启动速度快。

            **A lightweight third-party desktop music player written in Rust, built on GPUI** — shipped as a single file, with low memory usage and fast startup.

            ### 支持平台 / Platforms

            - Windows x86_64
            - Linux x86_64 / arm64
            - macOS arm64

            ### 主要功能 / Features

            - 本地音乐库：扫描与管理、元数据解析、内嵌封面、歌单、ReplayGain、歌词（LRC/KRC/YRC）
            - Local library: scanning, metadata, embedded covers, playlists, ReplayGain, lyrics (LRC/KRC/YRC)
            - 网易云音乐 / 酷狗音乐在线：扫码登录、搜索、歌单、榜单、在线播放与下载
            - NetEase Cloud Music / KuGou online: QR login, search, playlists, charts, streaming and downloading
            - 10 段均衡器与实时频谱可视化 / 10-band equalizer and real-time spectrum

            **完整变更见下方自动生成的 Release Notes / Full changelog is generated below.**
