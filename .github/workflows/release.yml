name: Build & Release

on:
  push:
    tags: ['v*']
  # 手动触发：验证单个平台修复时只编目标平台，避免全量重编已成功的平台
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build, comma-separated (e.g. "windows-arm64,linux-x64") or "all"'
        required: false
        default: all

permissions:
  contents: write

# 平台过滤表达式：tag 全量；workflow_dispatch 按 inputs.platforms 子串匹配 matrix.name
x-platform-filter: &platform_filter ${{ github.event_name == 'push' || inputs.platforms == 'all' || contains(inputs.platforms, matrix.name) }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,  name: windows-x64,   exe: meliora.exe, cflags: "" }
          - { os: windows-latest,   target: aarch64-pc-windows-msvc, name: windows-arm64, exe: meliora.exe, cflags: "-D__x86__" }
          # macOS（macos-13 Intel runner 已退役；x64 产物在 arm64 runner 上交叉编译，
          # x86_64-apple-darwin 无需额外工具链）
          - { os: macos-latest,     target: x86_64-apple-darwin,     name: macos-x64,     exe: meliora, cflags: "" }
          - { os: macos-latest,     target: aarch64-apple-darwin,    name: macos-arm64,   exe: meliora, cflags: "" }
          # Linux（ubuntu-24.04-arm = 原生 ARM64 runner，无需交叉编译）
          - { os: ubuntu-latest,     target: x86_64-unknown-linux-gnu,  name: linux-x64,  exe: meliora, cflags: "" }
          - { os: ubuntu-24.04-arm,  target: aarch64-unknown-linux-gnu, name: linux-arm64, exe: meliora, cflags: "" }

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml 钉死 Windows-msvc（仅本机非标准工具链需要），
      # CI 上删除并改用各平台宿主 stable + matrix target
      - name: Drop machine-specific toolchain pin
        shell: bash
        run: rm -f rust-toolchain.toml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # opusic-sys（bundled）构建期用 cmake 编译 libopus，
      # 显式安装统一版本避免 runner 预装版本差异
      - name: Install cmake
        uses: lukka/get-cmake@latest

      # Linux 系统依赖（cpal/GPUI）
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libasound2-dev libpipewire-0.3-dev pkg-config \
            libfontconfig1-dev libxkbcommon-dev libwayland-dev libx11-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        if: *platform_filter
        env:
          # fdk-aac-sys 在 Windows ARM64 编译需要 __x86__ 宏 hack（与本地 .cargo/config.toml 一致）
          CFLAGS_aarch64_pc_windows_msvc: ${{ matrix.cflags }}
        run: cargo build --release --locked --target ${{ matrix.target }} --features kugou,netease

      - name: Package Windows (zip)
        if: ${{ runner.os == 'Windows' && *platform_filter }}
        shell: pwsh
        run: |
          STAGE = "dist/meliora-${{ matrix.name }}"
          New-Item -ItemType Directory -Force -Path $STAGE | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.exe }}" "$STAGE/"
          Copy-Item README.md, LICENSE "$STAGE/"
          Compress-Archive -Path "$STAGE/*" -DestinationPath "dist/meliora-${{ github.ref_name }}-${{ matrix.name }}.zip"

      - name: Package macOS (.app tar.gz)
        if: ${{ runner.os == 'macOS' && *platform_filter }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE="dist/meliora-${{ matrix.name }}"
          APP="$STAGE/Meliora.app"
          mkdir -p "$APP/Contents/MacOS"
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" "$APP/Contents/MacOS/meliora"
          cp README.md LICENSE "$STAGE/"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>meliora</string>
            <key>CFBundleIdentifier</key><string>com.meliora.player</string>
            <key>CFBundleName</key><string>Meliora</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
          </dict>
          </plist>
          PLIST
          tar -czf "dist/meliora-${{ github.ref_name }}-${{ matrix.name }}.tar.gz" -C "$STAGE" "Meliora.app"

      - name: Package Linux (tar.gz)
        if: ${{ runner.os == 'Linux' && *platform_filter }}
        run: |
          set -euo pipefail
          STAGE="dist/meliora-${{ matrix.name }}"
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" "$STAGE/"
          cp README.md LICENSE "$STAGE/"
          tar -czf "dist/meliora-${{ github.ref_name }}-${{ matrix.name }}.tar.gz" -C "$STAGE" .

      - name: Upload artifact
        if: *platform_filter
        uses: actions/upload-artifact@v4
        with:
          name: meliora-${{ github.ref_name }}-${{ matrix.name }}
          path: dist/meliora-${{ github.ref_name }}-${{ matrix.name }}.*
          if-no-files-found: error

  # Tag 推送时创建 GitHub Release：等全部平台完成后再发一次，
  # 避免多 job 并行抢建同一 Release 引发 "Too many retries"
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## ${{ github.ref_name }}

            **Meliora** —— 基于 Rust + GPUI 的轻量第三方桌面音乐播放器：单文件分发、内存占用低、启动速度快。

            **A lightweight third-party desktop music player written in Rust, built on GPUI** — shipped as a single file, with low memory usage and fast startup.

            ### 支持平台 / Platforms

            - Windows x86_64 / arm64
            - Linux x86_64 / arm64
            - macOS x86_64 / arm64

            ### 主要功能 / Features

            - 本地音乐库：扫描与管理、元数据解析、内嵌封面、歌单、ReplayGain、歌词（LRC/KRC/YRC）
            - Local library: scanning, metadata, embedded covers, playlists, ReplayGain, lyrics (LRC/KRC/YRC)
            - 网易云音乐 / 酷狗音乐在线：扫码登录、搜索、歌单、榜单、在线播放与下载
            - NetEase Cloud Music / KuGou online: QR login, search, playlists, charts, streaming and downloading
            - 10 段均衡器与实时频谱可视化 / 10-band equalizer and real-time spectrum

            **完整变更见下方自动生成的 Release Notes / Full changelog is generated below.**